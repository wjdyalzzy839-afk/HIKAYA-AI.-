[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hikaya-ai"
version = "0.1.0"
description = "Arabic history and geography AI model built from scratch"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0"
]

[tool.setuptools.packages.find]
where = ["src"]
